name: CI

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Generar JavaDoc
        run: ./mvnw -B javadoc:javadoc

      - name: Construir imagen Docker (sin publicar)
        run: docker build -t eureka-server:ci .

      - name: Adjuntar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia
          path: |
            target/surefire-reports/
            target/reports/apidocs/